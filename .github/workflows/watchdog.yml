name: Trading Scheduler Watchdog

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: vn-trading-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Ho_Chi_Minh
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read watchdog decision from state branch
        id: decision
        shell: bash
        run: |
          git fetch origin state --depth=1 || true
          DEPLOYED_AT=$(git log -1 --format=%cI -- .github/workflows/watchdog.yml watchdog.py)
          DECISION=$(python watchdog.py --deployed-at "$DEPLOYED_AT")
          echo "json=$DECISION" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$DEPLOYED_AT" >> "$GITHUB_OUTPUT"
          echo "$DECISION" | python -m json.tool

      - name: Report legacy status grace once
        if: fromJSON(steps.decision.outputs.json).legacy_grace
        continue-on-error: true
        env:
          DEPLOYED_AT: ${{ steps.decision.outputs.deployed_at }}
        run: |
          RUNS=$(gh run list --workflow watchdog.yml --limit 100 --json databaseId,createdAt,status)
          PRIOR=$(RUNS="$RUNS" DEPLOYED_AT="$DEPLOYED_AT" CURRENT="$GITHUB_RUN_ID" python -c 'import json,os; from datetime import datetime; deployed=datetime.fromisoformat(os.environ["DEPLOYED_AT"]); print(sum(1 for r in json.loads(os.environ["RUNS"]) if str(r["databaseId"]) != os.environ["CURRENT"] and datetime.fromisoformat(r["createdAt"].replace("Z","+00:00")) >= deployed))')
          if [ "$PRIOR" -eq 0 ]; then
            echo "### Watchdog status initialization" >> "$GITHUB_STEP_SUMMARY"
            echo "Legacy system_status.json detected. Catch-up and Issue creation are suppressed for the 24-hour initialization grace period." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Dispatch bounded catch-up
        continue-on-error: true
        shell: bash
        env:
          DECISION: ${{ steps.decision.outputs.json }}
        run: |
          ACTIVE=$(gh run list --workflow scheduler.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Scheduler already queued/running; catch-up deferred."
            exit 0
          fi
          RUNS=$(gh run list --workflow scheduler.yml --event workflow_dispatch --limit 100 --json displayTitle,createdAt)
          echo "$DECISION" | python -c 'import json,sys; print("\n".join(json.load(sys.stdin)["missed"][:2]))' | while read -r TASK; do
            [ -z "$TASK" ] && continue
            ALREADY=$(RUNS="$RUNS" TASK="$TASK" python -c 'import json,os; from watchdog import dispatched_today; print(dispatched_today(json.loads(os.environ["RUNS"]), os.environ["TASK"]))')
            if [ "$ALREADY" = "True" ]; then
              echo "$TASK already had a workflow_dispatch catch-up today; skipping."
            else
              gh workflow run scheduler.yml -f task="$TASK"
            fi
          done

      - name: Create or update watchdog Issue first
        id: issue
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DECISION: ${{ steps.decision.outputs.json }}
        run: |
          NEED_ALERT=$(echo "$DECISION" | python -c 'import json,sys; print(json.load(sys.stdin)["issue_required"])')
          [ "$NEED_ALERT" = "False" ] && exit 0
          READABLE=$(echo "$DECISION" | python -c 'import json,sys; print(json.load(sys.stdin)["status_readable"])')
          if [ "$READABLE" = "False" ]; then
            TITLE="watchdog cannot read status"
          else
            TITLE="[watchdog] unattended trading system unhealthy"
          fi
          FP=$(echo "$DECISION" | python -c 'import json,sys; print(json.load(sys.stdin)["fingerprint"])')
          MARKER="<!-- fp:$FP -->"
          BODY="Watchdog decision: $DECISION\n\nRun: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n\n$MARKER"
          ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            ISSUE_JSON=$(gh issue view "$ISSUE" --json body,comments)
            LAST_FP=$(ISSUE_JSON="$ISSUE_JSON" python -c 'import json,os; from watchdog import latest_issue_fingerprint; print(latest_issue_fingerprint(json.loads(os.environ["ISSUE_JSON"])) or "")')
            if [ "$LAST_FP" = "$FP" ]; then
              echo "Issue fingerprint unchanged; no comment added."
            else
              gh issue comment "$ISSUE" --body "$BODY"
            fi
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Dispatch persisted trading kill switch
        id: disable
        if: always() && fromJSON(steps.decision.outputs.json).disable_trade
        continue-on-error: true
        env:
          DECISION: ${{ steps.decision.outputs.json }}
        run: |
          FLAG=$(git show origin/state:trading_disabled.json 2>/dev/null || true)
          ENABLED=$(FLAG="$FLAG" python -c 'import os; from watchdog import trading_disabled_payload_enabled; print(trading_disabled_payload_enabled(os.environ["FLAG"]))')
          if [ "$ENABLED" = "True" ]; then
            echo "Persisted trading kill switch is already enabled; dispatch skipped."
          else
            gh workflow run scheduler.yml -f task=disable-trading -f reason="watchdog escalation from run $GITHUB_RUN_ID: $DECISION"
          fi

      - name: Record watchdog action outcomes
        if: always()
        run: |
          echo "### Watchdog actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- Issue step: ${{ steps.issue.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Disable-trading dispatch: ${{ steps.disable.outcome }}" >> "$GITHUB_STEP_SUMMARY"

