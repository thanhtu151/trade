name: VN Trading Scheduler
run-name: scheduler-${{ inputs.task || github.event.schedule || 'unknown' }}

# Runs each scheduler.py task on its own cron (times are UTC = ICT-7).
# Each task is a one-shot `python scheduler.py <task>` that exits when done —
# a perfect fit for GitHub Actions' ephemeral runners. Runtime state (portfolio,
# trades, prediction history...) is persisted on a dedicated `state` branch so
# it survives between runs. Trained LSTM models are kept in the actions cache.
#
# ICT schedule (mirrors scheduler.py setup_schedule):
#   08:00 prep | 08:30 analysis | 09:20 trade | 15:00 eod | 16:00 learning
#   Mon 07:00 rebacktest

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 08:00 ICT  -> prep
    - cron: "30 1 * * 1-5"   # 08:30 ICT  -> analysis
    - cron: "20 2 * * 1-5"   # 09:20 ICT  -> trade
    - cron: "0 8 * * 1-5"    # 15:00 ICT  -> eod
    - cron: "0 9 * * 1-5"    # 16:00 ICT  -> learning
    - cron: "0 0 * * 1"      # Mon 07:00 ICT -> rebacktest
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run now"
        type: choice
        default: analysis
        options: [prep, analysis, trade, eod, learning, rebacktest, heal, calendar, rebaseline, migrate-ledger-epoch, disable-trading, enable-trading, promote-backtest-config, rollback-backtest-config]
      reason:
        description: "Required audit reason for rebaseline"
        type: string
        required: false
      confirmation:
        description: "Required exact confirmation for ledger migration"
        type: string
        required: false
      apply_migration:
        description: "Apply ledger migration (false performs dry-run only)"
        type: boolean
        default: false

# Serialize runs so two tasks never write the state branch at the same time.
concurrency:
  group: vn-trading-scheduler
  cancel-in-progress: false

permissions:
  contents: write   # GITHUB_TOKEN needs write to push the `state` branch
  issues: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUTF8: "1"
      TF_CPP_MIN_LOG_LEVEL: "3"
      CUDA_VISIBLE_DEVICES: ""
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISPATCH_REASON: ${{ github.event.inputs.reason }}
      DISPATCH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
      APPLY_MIGRATION: ${{ github.event.inputs.apply_migration }}
      # Files that change at runtime and must persist across runs. All are
      # gitignored on `main`, so overlaying them from `state` never conflicts.
      STATE_FILES: >-
        paper_portfolio.json paper_trades.json scheduler_state.json
        analysis_results.json prediction_history.json prediction_log.json
        learning_memory.json debate_log.json portfolio_snapshots.json
        performance_report.json system_status.json tracked_positions.json
        advisor_audit_log.json intraday_alerts.json auto_analysis_state.json
        vn_live_data_cache.json llm_router_usage.json self_healing_state.json
        circuit_breaker_state.json
        discord_notification_state.json
        paper_portfolio.json.bak paper_trades.json.bak
        trading_disabled.json trading_switch_audit.json self_healing_audit.json
        paper_ledger_transaction.json
        rebacktest_checkpoint.json
        backtest_config.json backtest_config.candidate.json
        backtest_config.backup.json backtest_config_audit.json
        paper_portfolio.json.pre_task.bak paper_trades.json.pre_task.bak
        pre_task_snapshot.json
        etf_core_state.json
        trading_calendar.json
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to fetch the state branch too

      - name: Decide which task to run
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.task }}" ]; then
            TASK="${{ github.event.inputs.task }}"
          else
            case "${{ github.event.schedule }}" in
              "0 1 * * 1-5")  TASK=prep ;;
              "30 1 * * 1-5") TASK=analysis ;;
              "20 2 * * 1-5") TASK=trade ;;
              "0 8 * * 1-5")  TASK=eod ;;
              "0 9 * * 1-5")  TASK=learning ;;
              "0 0 * * 1")    TASK=rebacktest ;;
              *)              TASK=analysis ;;
            esac
          fi
          if [ "$TASK" = "rebaseline" ] && [ -z "$DISPATCH_REASON" ]; then
            echo "::error::reason is required for rebaseline"
            exit 2
          fi
          if [ "$TASK" = "migrate-ledger-epoch" ] && [ "$DISPATCH_CONFIRMATION" != "MIGRATE_LEDGER_EPOCH_2026_07_09" ]; then
            echo "::error::confirmation must equal MIGRATE_LEDGER_EPOCH_2026_07_09"
            exit 2
          fi
          if [ "$TASK" = "disable-trading" ] && [ -z "$DISPATCH_REASON" ]; then
            echo "::error::reason is required for disable-trading"
            exit 2
          fi
          if [ "$TASK" = "enable-trading" ] && [ "$DISPATCH_CONFIRMATION" != "ENABLE_TRADING" ]; then
            echo "::error::confirmation must equal ENABLE_TRADING"
            exit 2
          fi
          if [ "$TASK" = "promote-backtest-config" ] && [ "$DISPATCH_CONFIRMATION" != "PROMOTE_BACKTEST_CONFIG" ]; then
            echo "::error::confirmation must equal PROMOTE_BACKTEST_CONFIG"
            exit 2
          fi
          if [ "$TASK" = "rollback-backtest-config" ] && [ "$DISPATCH_CONFIRMATION" != "ROLLBACK_BACKTEST_CONFIG" ]; then
            echo "::error::confirmation must equal ROLLBACK_BACKTEST_CONFIG"
            exit 2
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Running task: $TASK (ICT $(date '+%Y-%m-%d %H:%M %Z'))"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # State must be available even when dependency installation fails. The
      # always-run healing and persistence steps must never depend on a prior
      # package-install step having created /tmp/state.
      - name: Load state from `state` branch
        id: load-state
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          if git fetch origin state --depth=1 2>/dev/null && \
             git show-ref --verify --quiet refs/remotes/origin/state; then
            git worktree add /tmp/state origin/state
            echo "base_sha=$(git rev-parse origin/state)" >> "$GITHUB_OUTPUT"
            for f in $STATE_FILES; do
              if [ -f "/tmp/state/$f" ]; then
                cp "/tmp/state/$f" "$f"
                echo "  loaded $f"
              fi
            done
          else
            echo "No state branch yet — first run will create it."
            git worktree add --detach /tmp/state HEAD
            git -C /tmp/state checkout -q --orphan state
            git -C /tmp/state rm -q -rf .
            echo "base_sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist automatic trading kill switch
        id: disable_switch
        if: steps.pick.outputs.task == 'disable-trading'
        run: python trading_safety.py --disable --reason "$DISPATCH_REASON" --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID"

      - name: Remove trading kill switch after explicit confirmation
        id: enable_switch
        if: steps.pick.outputs.task == 'enable-trading'
        run: python trading_safety.py --enable --confirmation "$DISPATCH_CONFIRMATION" --reason "$DISPATCH_REASON" --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID"

      - name: Promote validated backtest candidate
        if: steps.pick.outputs.task == 'promote-backtest-config'
        run: python config_store.py --promote --confirmation "$DISPATCH_CONFIRMATION" --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID"

      - name: Roll back active backtest config
        if: steps.pick.outputs.task == 'rollback-backtest-config'
        run: python config_store.py --rollback --confirmation "$DISPATCH_CONFIRMATION" --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID"

      - name: Install dependencies
        id: dependencies
        if: steps.pick.outputs.task != 'disable-trading' && steps.pick.outputs.task != 'enable-trading' && steps.pick.outputs.task != 'promote-backtest-config' && steps.pick.outputs.task != 'rollback-backtest-config'
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://vnstocks.com/api/simple --no-deps --only-binary=:all: --require-hashes -r requirements-vnstock.txt
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Reconstruct .env from secret
        id: environment
        if: steps.pick.outputs.task != 'disable-trading' && steps.pick.outputs.task != 'enable-trading' && steps.pick.outputs.task != 'promote-backtest-config' && steps.pick.outputs.task != 'rollback-backtest-config'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::warning::ENV_FILE secret is empty — external LLM providers will be unavailable"
          else
            printf '%s\n' "$ENV_FILE" > .env
            echo ".env written ($(wc -l < .env) lines)"
          fi

      - name: Restore LSTM models cache
        id: model_cache
        if: steps.pick.outputs.task != 'disable-trading' && steps.pick.outputs.task != 'enable-trading' && steps.pick.outputs.task != 'promote-backtest-config' && steps.pick.outputs.task != 'rollback-backtest-config'
        uses: actions/cache@v4
        with:
          path: lstm_models
          key: lstm-models-${{ github.run_id }}
          restore-keys: |
            lstm-models-

      - name: Run scheduler task
        id: scheduler_task
        if: steps.pick.outputs.task != 'rebaseline' && steps.pick.outputs.task != 'migrate-ledger-epoch' && steps.pick.outputs.task != 'disable-trading' && steps.pick.outputs.task != 'enable-trading' && steps.pick.outputs.task != 'promote-backtest-config' && steps.pick.outputs.task != 'rollback-backtest-config'
        run: python scheduler.py ${{ steps.pick.outputs.task }}

      - name: Rebaseline unexplained ledger drift
        id: rebaseline
        if: steps.pick.outputs.task == 'rebaseline'
        run: python self_healing.py --rebaseline --reason "$DISPATCH_REASON" --operator "$GITHUB_ACTOR"

      - name: Apply confirmed ledger epoch migration
        id: migration
        if: steps.pick.outputs.task == 'migrate-ledger-epoch'
        run: |
          APPLY_ARG=""
          [ "$APPLY_MIGRATION" = "true" ] && APPLY_ARG="--apply"
          python self_healing.py --migrate-ledger-epoch --confirm "$DISPATCH_CONFIRMATION" --operator "$GITHUB_ACTOR" $APPLY_ARG

      - name: Self-healing state audit
        id: healing_audit
        if: always()
        run: |
          if [ "${{ steps.pick.outputs.task }}" = "rebaseline" ] || [ "${{ steps.pick.outputs.task }}" = "migrate-ledger-epoch" ] || [ "${{ steps.pick.outputs.task }}" = "disable-trading" ] || [ "${{ steps.pick.outputs.task }}" = "enable-trading" ] || [ "${{ steps.pick.outputs.task }}" = "promote-backtest-config" ] || [ "${{ steps.pick.outputs.task }}" = "rollback-backtest-config" ]; then
            python self_healing.py --maintenance-audit
          else
            python self_healing.py
          fi

      - name: Persist state to `state` branch
        id: persist_state
        if: always()   # save even if the task errored, so we keep progress
        run: |
          git config --global user.name "trade-bot"
          git config --global user.email "trade-bot@users.noreply.github.com"
          cd /tmp/state
          git checkout -q -B state 2>/dev/null || git checkout -q --orphan state
          cd "$GITHUB_WORKSPACE"
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/state/$f"
            else
              rm -f "/tmp/state/$f"
            fi
          done
          cd "$GITHUB_WORKSPACE"
          python state_push.py --worktree /tmp/state --expected-sha "${{ steps.load-state.outputs.base_sha }}" --task "${{ steps.pick.outputs.task }}"

      - name: Alert on unattended run failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          TITLE="[scheduler] unattended task failure"
          ICT_DATE=$(date '+%Y-%m-%d')
          FAILED_STEPS=$(python -c 'import json,os; from workflow_alerts import failed_step_names; print(",".join(failed_step_names(json.loads(os.environ["STEPS_JSON"]))))')
          FP=$(TASK="${{ steps.pick.outputs.task }}" FAILED_STEPS="$FAILED_STEPS" ICT_DATE="$ICT_DATE" python -c 'import os; from workflow_alerts import scheduler_failure_fingerprint; print(scheduler_failure_fingerprint(os.environ["TASK"], os.environ["FAILED_STEPS"].split(","), os.environ["ICT_DATE"]))')
          MARKER="<!-- fp:$FP -->"
          BODY="Task ${{ steps.pick.outputs.task }} failed at [$FAILED_STEPS] in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Self-healing was invoked; inspect the failed step and state-push result.\n\n$MARKER"
          ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            ISSUE_JSON=$(gh issue view "$ISSUE" --json body,comments)
            LAST_FP=$(ISSUE_JSON="$ISSUE_JSON" python -c 'import json,os; from workflow_alerts import latest_fingerprint; print(latest_fingerprint(json.loads(os.environ["ISSUE_JSON"])) or "")')
            if [ "$LAST_FP" = "$FP" ]; then
              echo "Scheduler failure fingerprint unchanged; no comment added."
            else
              gh issue comment "$ISSUE" --body "$BODY"
              python notify.py failed --task "${{ steps.pick.outputs.task }}" --error "$FAILED_STEPS" --fingerprint "$FP"
            fi
          else
            gh issue create --title "$TITLE" --body "$BODY"
            python notify.py failed --task "${{ steps.pick.outputs.task }}" --error "$FAILED_STEPS" --fingerprint "$FP"
          fi
