name: VN Trading Scheduler

# Runs each scheduler.py task on its own cron (times are UTC = ICT-7).
# Each task is a one-shot `python scheduler.py <task>` that exits when done —
# a perfect fit for GitHub Actions' ephemeral runners. Runtime state (portfolio,
# trades, prediction history...) is persisted on a dedicated `state` branch so
# it survives between runs. Trained LSTM models are kept in the actions cache.
#
# ICT schedule (mirrors scheduler.py setup_schedule):
#   08:00 prep | 08:30 analysis | 09:20 trade | 15:00 eod | 16:00 learning
#   Mon 07:00 rebacktest

on:
  schedule:
    - cron: "0 1 * * 1-5"    # 08:00 ICT  -> prep
    - cron: "30 1 * * 1-5"   # 08:30 ICT  -> analysis
    - cron: "20 2 * * 1-5"   # 09:20 ICT  -> trade
    - cron: "0 8 * * 1-5"    # 15:00 ICT  -> eod
    - cron: "0 9 * * 1-5"    # 16:00 ICT  -> learning
    - cron: "0 0 * * 1"      # Mon 07:00 ICT -> rebacktest
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run now"
        type: choice
        default: analysis
        options: [prep, analysis, trade, eod, learning, rebacktest, heal, rebaseline, migrate-ledger-epoch]
      reason:
        description: "Required audit reason for rebaseline"
        type: string
        required: false
      confirmation:
        description: "Required exact confirmation for ledger migration"
        type: string
        required: false
      apply_migration:
        description: "Apply ledger migration (false performs dry-run only)"
        type: boolean
        default: false

# Serialize runs so two tasks never write the state branch at the same time.
concurrency:
  group: vn-trading-scheduler
  cancel-in-progress: false

permissions:
  contents: write   # GITHUB_TOKEN needs write to push the `state` branch

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUTF8: "1"
      TF_CPP_MIN_LOG_LEVEL: "3"
      CUDA_VISIBLE_DEVICES: ""
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
      DISPATCH_REASON: ${{ github.event.inputs.reason }}
      DISPATCH_CONFIRMATION: ${{ github.event.inputs.confirmation }}
      APPLY_MIGRATION: ${{ github.event.inputs.apply_migration }}
      # Files that change at runtime and must persist across runs. All are
      # gitignored on `main`, so overlaying them from `state` never conflicts.
      STATE_FILES: >-
        paper_portfolio.json paper_trades.json scheduler_state.json
        analysis_results.json prediction_history.json prediction_log.json
        learning_memory.json debate_log.json portfolio_snapshots.json
        performance_report.json system_status.json tracked_positions.json
        advisor_audit_log.json intraday_alerts.json auto_analysis_state.json
        vn_live_data_cache.json llm_router_usage.json self_healing_state.json
        circuit_breaker_state.json
        paper_portfolio.json.bak paper_trades.json.bak
        trading_disabled.json self_healing_audit.json
        paper_ledger_transaction.json
        paper_portfolio.json.pre_task.bak paper_trades.json.pre_task.bak
        pre_task_snapshot.json
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to fetch the state branch too

      - name: Decide which task to run
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.task }}" ]; then
            TASK="${{ github.event.inputs.task }}"
          else
            case "${{ github.event.schedule }}" in
              "0 1 * * 1-5")  TASK=prep ;;
              "30 1 * * 1-5") TASK=analysis ;;
              "20 2 * * 1-5") TASK=trade ;;
              "0 8 * * 1-5")  TASK=eod ;;
              "0 9 * * 1-5")  TASK=learning ;;
              "0 0 * * 1")    TASK=rebacktest ;;
              *)              TASK=analysis ;;
            esac
          fi
          if [ "$TASK" = "rebaseline" ] && [ -z "$DISPATCH_REASON" ]; then
            echo "::error::reason is required for rebaseline"
            exit 2
          fi
          if [ "$TASK" = "migrate-ledger-epoch" ] && [ "$DISPATCH_CONFIRMATION" != "MIGRATE_LEDGER_EPOCH_2026_07_09" ]; then
            echo "::error::confirmation must equal MIGRATE_LEDGER_EPOCH_2026_07_09"
            exit 2
          fi
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Running task: $TASK (ICT $(date '+%Y-%m-%d %H:%M %Z'))"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # State must be available even when dependency installation fails. The
      # always-run healing and persistence steps must never depend on a prior
      # package-install step having created /tmp/state.
      - name: Load state from `state` branch
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          if git fetch origin state --depth=1 2>/dev/null && \
             git show-ref --verify --quiet refs/remotes/origin/state; then
            git worktree add /tmp/state origin/state
            for f in $STATE_FILES; do
              [ -f "/tmp/state/$f" ] && cp "/tmp/state/$f" "$f" && echo "  loaded $f"
            done
          else
            echo "No state branch yet — first run will create it."
            mkdir -p /tmp/state
            git -C /tmp/state init -q
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://vnstocks.com/api/simple --no-deps --only-binary=:all: --require-hashes -r requirements-vnstock.txt
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Reconstruct .env from secret
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "::warning::ENV_FILE secret is empty — external LLM providers will be unavailable"
          else
            printf '%s\n' "$ENV_FILE" > .env
            echo ".env written ($(wc -l < .env) lines)"
          fi

      - name: Restore LSTM models cache
        uses: actions/cache@v4
        with:
          path: lstm_models
          key: lstm-models-${{ github.run_id }}
          restore-keys: |
            lstm-models-

      - name: Run scheduler task
        if: steps.pick.outputs.task != 'rebaseline' && steps.pick.outputs.task != 'migrate-ledger-epoch'
        run: python scheduler.py ${{ steps.pick.outputs.task }}

      - name: Rebaseline unexplained ledger drift
        if: steps.pick.outputs.task == 'rebaseline'
        run: python self_healing.py --rebaseline --reason "$DISPATCH_REASON" --operator "$GITHUB_ACTOR"

      - name: Apply confirmed ledger epoch migration
        if: steps.pick.outputs.task == 'migrate-ledger-epoch'
        run: |
          APPLY_ARG=""
          [ "$APPLY_MIGRATION" = "true" ] && APPLY_ARG="--apply"
          python self_healing.py --migrate-ledger-epoch --confirm "$DISPATCH_CONFIRMATION" --operator "$GITHUB_ACTOR" $APPLY_ARG

      - name: Self-healing state audit
        if: always()
        run: |
          if [ "${{ steps.pick.outputs.task }}" = "rebaseline" ] || [ "${{ steps.pick.outputs.task }}" = "migrate-ledger-epoch" ]; then
            python self_healing.py --maintenance-audit
          else
            python self_healing.py
          fi

      - name: Persist state to `state` branch
        if: always()   # save even if the task errored, so we keep progress
        run: |
          git config --global user.name "trade-bot"
          git config --global user.email "trade-bot@users.noreply.github.com"
          cd /tmp/state
          git checkout -q -B state 2>/dev/null || git checkout -q --orphan state
          cd "$GITHUB_WORKSPACE"
          for f in $STATE_FILES; do
            [ -f "$f" ] && cp "$f" "/tmp/state/$f"
          done
          cd /tmp/state
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -q -m "state: after ${{ steps.pick.outputs.task }} ($(date -u '+%Y-%m-%dT%H:%M:%SZ'))"
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:state
            echo "State pushed."
          fi
