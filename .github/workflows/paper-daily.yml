name: Paper Daily (ETF core E1/E6)
run-name: paper-daily-${{ github.event_name }}

# DRAFT to be copied verbatim to .github/workflows/paper-daily.yml (see ~/Downloads/office/reports/T62_push_plan.md).
# PAPER ONLY: PaperBroker, no real orders, no secrets. Cron is UTC: 30 8 = 15:30 ICT (HOSE closes 14:45).
# The code under test is checked out from the feature branch, so `main` only needs THIS file for the
# schedule to fire (GitHub runs `schedule` only from the default branch).
# Runtime state (paper_state.json, summary.csv, signals.jsonl, orders.jsonl, daily logs) lives on its own
# `paper-state` branch, separate from the bot's `state` branch.

on:
  schedule:
    - cron: "30 8 * * 1-5"      # 15:30 ICT, Mon-Fri
  workflow_dispatch:
  push:
    branches: [feat/paper-etf-broker]
    paths:
      - ".github/workflows/paper-daily.yml"   # first trial run without `gh workflow run`

concurrency:
  group: paper-daily
  cancel-in-progress: false

permissions:
  contents: write     # GITHUB_TOKEN pushes the `paper-state` branch; no other secret is used

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Ho_Chi_Minh
      PYTHONUTF8: "1"
      CODE_REF: feat/paper-etf-broker
      STATE_BRANCH: paper-state
    steps:
      - name: Checkout code (feature branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://vnstocks.com/api/simple --no-deps --only-binary=:all: --require-hashes -r requirements-vnstock.txt
          pip install -r requirements.txt

      - name: Load paper state (branch paper-state)
        run: |
          mkdir -p paper_logs
          git fetch origin "$STATE_BRANCH" || echo "no $STATE_BRANCH branch yet: starting empty"
          if git rev-parse --verify -q "origin/$STATE_BRANCH" >/dev/null; then
            git worktree add /tmp/pstate "origin/$STATE_BRANCH"
            cp -a /tmp/pstate/paper_logs/. paper_logs/ 2>/dev/null || true
          else
            git worktree add --detach /tmp/pstate HEAD
            git -C /tmp/pstate checkout -q --orphan "$STATE_BRANCH"
            git -C /tmp/pstate rm -q -rf .
          fi
          echo "summary rows before: $(wc -l < paper_logs/summary.csv 2>/dev/null || echo 0)"

      - name: Run paper session (with catch-up)
        run: |
          DAY="$(date +%F)"
          python paper_run.py --date "$DAY" --source data_fetcher --require-exact --catch-up \
            --summary-csv paper_logs/summary.csv 2>&1 | tee -a "paper_logs/daily_${DAY}.log"
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Persist paper state to `paper-state` branch
        if: always()
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          mkdir -p /tmp/pstate/paper_logs
          cp -a paper_logs/. /tmp/pstate/paper_logs/
          cd /tmp/pstate
          git add paper_logs
          if git diff --cached --quiet; then
            echo "no state change"; exit 0
          fi
          git commit -q -m "paper-state: $(date +%F) run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git push origin "HEAD:refs/heads/${STATE_BRANCH}" && exit 0
            git fetch origin "$STATE_BRANCH" && git rebase "origin/$STATE_BRANCH"
          done
          echo "::error::could not push $STATE_BRANCH"; exit 1

      - name: Summary
        if: always()
        run: |
          echo "summary rows after: $(wc -l < paper_logs/summary.csv 2>/dev/null || echo 0)"
          tail -n 5 paper_logs/summary.csv 2>/dev/null || true
